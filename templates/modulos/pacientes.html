{% extends "plantilla.html" %}

{% block content %}

<section class="content-header">
    <h1>GESTOR DE PACIENTES</h1>
</section>

<section class="content">
    <div class="box">
        <div class="body-header">
            <a href="{{ url_for('crear_paciente') }}">
                <button class="btn btn-primary">Crear Paciente</button>
            </a>
        </div>

        <div class="box-body">

            <table id="tablaDoctores" class="table table-bordered table-striped dt-responsive">
                <thead>
                    <tr>
                        <th>Nombre y Apellido</th>
                        <th>Usuario</th>
                        <th>Documento</th>
                        <th>Editar / Borrar</th>
                    </tr>
                </thead>

                <tbody>
                    {% for paciente in pacientes %}
                        <tr>
                            <td>{{ paciente.name_user }}</td>
                            <td>{{ paciente.user }}</td>
                            <td>{{ paciente.document_user }}</td>
                            <td>
                                <a href="{{ url_for('editar_paciente', id_paciente=paciente.id_user) }}">
                                    <button class="btn btn-warning">Editar</button>
                                </a>

                                <form method="post" action="{{ url_for('eliminar_paciente', id_paciente=paciente.id_user) }}" style="display: inline-block;">
                                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Estas seguro de eliminar al paciente?')">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</section>

{% endblock %}
