{% extends "plantilla.html" %}

{% block content %}

<section class="content-header">
    <h1>GESTOR DE CONSULTORIOS</h1>
</section>

<section class=""content">
    <div class="box">
        <div class="box-body">

            <form method="post">
                <input type="hidden" name="action" value="agregar">
                <div class="col-md-6 col-xs-12">
                    <input type="text" name="consultorio" class="form-control" placeholder="Nombre del consultorio" required>
                </div>

                <button type="submit" class="btn btn-primary">Agregar consultorio</button>
            </form>

            <br>

            {% for consultorio in consultorios %}

                <div class="row" style="margin-bottom: 10px;">

                    <form method="post" class="form-inline" style="width: 100%;">

                        <div class="col-md-8">
                            <input type="text" class="form-control" name="consultorioEditar" value="{{consultorio.consultorio}}" style="width: 100%;">

                            <input type="hidden" name="idC" class="form-control" value="{{consultorio.id}}" style="width: 100%;">
                        </div>

                        <div class="col-md-2">
                            <button class="btn btn-success btn-blocl" type="submit" name="action" value="editar">Guardar</button>
                        </div>

                        <div class="col-md-2">
                            <button class="btn btn-danger btn-blocl" type="submit" name="action" value="eliminar">Eliminar</button>
                        </div>

                    </form>

                </div>

            {% endfor %}

        </div>
    </div>

</section>

{% endblock %}
